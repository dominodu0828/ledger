# Render blueprint — the deploy path that does not need a cloud account upgrade.
#
# App Runner (see apprunner.yaml) remains the preferred target and is kept in
# this repo, but it is unavailable on an AWS free-plan account. Hosting is not
# the AWS-service requirement for this submission in any case: Bedrock supplies
# the embeddings and the reasoning model, and it is reached over the API from
# wherever this container runs.
#
# `sync: false` means Render prompts for the value at deploy time and stores it
# encrypted — those three never enter the repository.
services:
  - type: web
    name: ledger
    runtime: python
    plan: free
    healthCheckPath: /healthz
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: AWS_REGION
        value: us-east-1
      - key: BEDROCK_EMBED_MODEL
        value: amazon.titan-embed-text-v2:0
      - key: BEDROCK_CHAT_MODEL
        value: amazon.nova-pro-v1:0
      - key: CHAT_BACKEND
        value: boto3
      - key: SCREEN_THRESHOLD
        value: "0.5"
      - key: COCKROACH_DSN
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
