<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6472"/>
    </marker>
  </defs>

  <rect width="1000" height="800" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="500" y="42" text-anchor="middle" font-size="25" font-weight="700" fill="#16181D">Ledger — the write transaction is the security boundary</text>
  <text x="500" y="68" text-anchor="middle" font-size="14" fill="#5B6472">Provenance-tracked, revocable agent memory · CockroachDB × AWS Bedrock</text>

  <!-- 1. Sources -->
  <g>
    <rect x="40" y="100" width="293" height="56" rx="8" fill="#FDF2F2" stroke="#C0392B" stroke-width="1.5"/>
    <text x="186" y="124" text-anchor="middle" font-size="14" font-weight="600" fill="#16181D">Web page · document</text>
    <text x="186" y="143" text-anchor="middle" font-size="12" fill="#C0392B">trust tier 0 — untrusted</text>

    <rect x="353" y="100" width="293" height="56" rx="8" fill="#FEF7EC" stroke="#D68910" stroke-width="1.5"/>
    <text x="499" y="124" text-anchor="middle" font-size="14" font-weight="600" fill="#16181D">Tool output · third-party API</text>
    <text x="499" y="143" text-anchor="middle" font-size="12" fill="#B9770E">trust tier 1 — classic injection carrier</text>

    <rect x="666" y="100" width="293" height="56" rx="8" fill="#F0F7F1" stroke="#1E8449" stroke-width="1.5"/>
    <text x="812" y="124" text-anchor="middle" font-size="14" font-weight="600" fill="#16181D">User · Operator</text>
    <text x="812" y="143" text-anchor="middle" font-size="12" fill="#1E8449">trust tier 2 · 3</text>
  </g>

  <line x1="186" y1="156" x2="186" y2="194" stroke="#5B6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="499" y1="156" x2="499" y2="194" stroke="#5B6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="812" y1="156" x2="812" y2="194" stroke="#5B6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. Screening gate -->
  <rect x="40" y="196" width="919" height="60" rx="8" fill="#F7F8FA" stroke="#16181D" stroke-width="2"/>
  <text x="499" y="221" text-anchor="middle" font-size="16" font-weight="700" fill="#16181D">screen()  —  deterministic rules, weighted, trust-tier discounted</text>
  <text x="499" y="242" text-anchor="middle" font-size="12.5" fill="#5B6472">override · fund-redirect · exfiltration signals are operator-only: below tier 3 they forfeit the discount entirely</text>

  <line x1="499" y1="256" x2="499" y2="294" stroke="#5B6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. Embedding -->
  <rect x="212" y="296" width="575" height="54" rx="8" fill="#FFF6E9" stroke="#FF9900" stroke-width="2"/>
  <text x="499" y="319" text-anchor="middle" font-size="14.5" font-weight="600" fill="#16181D">AWS Bedrock — Titan Text Embeddings V2 · 1024-d, normalized</text>
  <text x="499" y="338" text-anchor="middle" font-size="12" fill="#8A5B00">admitted content only, and deliberately before the transaction opens</text>

  <line x1="499" y1="350" x2="499" y2="388" stroke="#5B6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4. The transaction -->
  <rect x="40" y="390" width="919" height="146" rx="10" fill="#F6F2FF" stroke="#6933FF" stroke-width="2.5"/>
  <text x="499" y="417" text-anchor="middle" font-size="16.5" font-weight="700" fill="#4A1FB8">ONE CockroachDB TRANSACTION</text>
  <text x="499" y="437" text-anchor="middle" font-size="12.5" fill="#5B6472">verdict, row and audit record commit together — a rejected write is never retrievable, not for a millisecond</text>

  <rect x="56" y="450" width="213" height="70" rx="7" fill="#FFFFFF" stroke="#6933FF" stroke-width="1.3"/>
  <text x="162" y="476" text-anchor="middle" font-size="13.5" font-weight="600" fill="#16181D">memories</text>
  <text x="162" y="495" text-anchor="middle" font-size="11.5" fill="#5B6472">VECTOR(1024) + tier</text>
  <text x="162" y="511" text-anchor="middle" font-size="11.5" fill="#5B6472">VECTOR INDEX</text>

  <rect x="281" y="450" width="213" height="70" rx="7" fill="#FFFFFF" stroke="#6933FF" stroke-width="1.3"/>
  <text x="387" y="476" text-anchor="middle" font-size="13.5" font-weight="600" fill="#16181D">memory_edges</text>
  <text x="387" y="495" text-anchor="middle" font-size="11.5" fill="#5B6472">derivation graph</text>
  <text x="387" y="511" text-anchor="middle" font-size="11.5" fill="#5B6472">derived_from</text>

  <rect x="506" y="450" width="213" height="70" rx="7" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.3"/>
  <text x="612" y="476" text-anchor="middle" font-size="13.5" font-weight="600" fill="#16181D">quarantine</text>
  <text x="612" y="495" text-anchor="middle" font-size="11.5" fill="#5B6472">rejected writes +</text>
  <text x="612" y="511" text-anchor="middle" font-size="11.5" fill="#5B6472">rules that fired</text>

  <rect x="731" y="450" width="213" height="70" rx="7" fill="#FFFFFF" stroke="#6933FF" stroke-width="1.3"/>
  <text x="837" y="476" text-anchor="middle" font-size="13.5" font-weight="600" fill="#16181D">audit_log</text>
  <text x="837" y="495" text-anchor="middle" font-size="11.5" fill="#5B6472">append-only</text>
  <text x="837" y="511" text-anchor="middle" font-size="11.5" fill="#5B6472">same txn as the action</text>

  <line x1="186" y1="536" x2="186" y2="574" stroke="#5B6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="499" y1="536" x2="499" y2="574" stroke="#5B6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="812" y1="536" x2="812" y2="574" stroke="#5B6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 5. Read / control paths -->
  <g>
    <rect x="40" y="576" width="293" height="70" rx="8" fill="#FFFFFF" stroke="#16181D" stroke-width="1.5"/>
    <text x="186" y="600" text-anchor="middle" font-size="14" font-weight="700" fill="#16181D">recall</text>
    <text x="186" y="619" text-anchor="middle" font-size="11.5" fill="#5B6472">vector index + trust predicate</text>
    <text x="186" y="635" text-anchor="middle" font-size="11.5" fill="#5B6472">evaluated in one query</text>

    <rect x="353" y="576" width="293" height="70" rx="8" fill="#FFFFFF" stroke="#16181D" stroke-width="1.5"/>
    <text x="499" y="600" text-anchor="middle" font-size="14" font-weight="700" fill="#16181D">revoke</text>
    <text x="499" y="619" text-anchor="middle" font-size="11.5" fill="#5B6472">recursive CTE over the graph</text>
    <text x="499" y="635" text-anchor="middle" font-size="11.5" fill="#5B6472">cascades in one transaction</text>

    <rect x="666" y="576" width="293" height="70" rx="8" fill="#FFFFFF" stroke="#16181D" stroke-width="1.5"/>
    <text x="812" y="600" text-anchor="middle" font-size="14" font-weight="700" fill="#16181D">replay</text>
    <text x="812" y="619" text-anchor="middle" font-size="11.5" fill="#5B6472">AS OF SYSTEM TIME</text>
    <text x="812" y="635" text-anchor="middle" font-size="11.5" fill="#5B6472">belief state at time T</text>
  </g>

  <line x1="186" y1="646" x2="186" y2="684" stroke="#5B6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="499" y1="646" x2="499" y2="684" stroke="#5B6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="812" y1="646" x2="812" y2="684" stroke="#5B6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 6. Surfaces -->
  <g>
    <rect x="40" y="686" width="293" height="62" rx="8" fill="#F7F8FA" stroke="#5B6472" stroke-width="1.5"/>
    <text x="186" y="712" text-anchor="middle" font-size="13.5" font-weight="600" fill="#16181D">MCP server</text>
    <text x="186" y="731" text-anchor="middle" font-size="11.5" fill="#5B6472">8 tools · stdio or streamable HTTP</text>

    <rect x="353" y="686" width="293" height="62" rx="8" fill="#F7F8FA" stroke="#5B6472" stroke-width="1.5"/>
    <text x="499" y="712" text-anchor="middle" font-size="13.5" font-weight="600" fill="#16181D">FastAPI + demo UI</text>
    <text x="499" y="731" text-anchor="middle" font-size="11.5" fill="#5B6472">AWS App Runner · Amazon ECR</text>

    <rect x="666" y="686" width="293" height="62" rx="8" fill="#FFF6E9" stroke="#FF9900" stroke-width="1.5"/>
    <text x="812" y="712" text-anchor="middle" font-size="13.5" font-weight="600" fill="#16181D">Amazon Nova Pro on Bedrock</text>
    <text x="812" y="731" text-anchor="middle" font-size="11.5" fill="#5B6472">memory-augmented answers</text>
  </g>

  <text x="500" y="778" text-anchor="middle" font-size="11.5" fill="#8A94A6">Poisoned memory is rejected inside the write transaction — it never reaches the retrieval set, and revoking its source takes every descendant with it.</text>
</svg>
